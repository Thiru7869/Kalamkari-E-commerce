name: CI

on:
  push:
    # The default branch here is `master`. This said `main`, so no push to this
    # repository has ever triggered CI — every green tick came from a pull
    # request, and direct pushes to the deployed branch went unverified.
    branches: [master]
  pull_request:
  workflow_dispatch:

# A second push to the same branch cancels the first — the earlier result is
# no longer interesting once it has been superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · test · build · smoke
    runs-on: ubuntu-latest

    # CI runs the same engine production runs. It used to run SQLite against a
    # throwaway file, which is how a search filter that returns nothing on
    # Postgres passed CI: the query is valid on both, and only one of them is
    # case-insensitive by default.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: svl
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: kalamkari
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U svl -d kalamkari"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # Throwaway credentials against a throwaway container. Nothing here is a
      # real credential and nothing here reaches a real service: with no SMTP
      # host and no payment keys set, the mail layer prints to the console and
      # the online payment option is simply not offered. That is exactly the
      # degraded configuration worth testing.
      #
      # No pooler in front of this one, so both URLs are the same host.
      DATABASE_URL: postgresql://svl:ci-only-password@localhost:5432/kalamkari?schema=public
      DIRECT_DATABASE_URL: postgresql://svl:ci-only-password@localhost:5432/kalamkari?schema=public
      AUTH_SECRET: ci-only-not-a-real-secret-value-000000000000
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches `engines.node` in package.json, which is the major Vercel
          # deploys. CI ran 22 while the deployment ran 24 — testing a runtime
          # nothing shipped on.
          node-version: 24
          cache: npm

      # Plain `npm ci`, which reads `.npmrc`. The `legacy-peer-deps=true` in
      # there is load-bearing rather than lazy: every nodemailer up to and
      # including 9.0.0 carries high-severity advisories, and next-auth's beta
      # declares an optional peer range of ^7 || ^8 that excludes the fixed
      # line. See `.npmrc` for why that range is metadata rather than a real
      # incompatibility. Vercel's install command passes the same flag, so CI
      # and the deployment resolve one tree instead of two.
      - name: Install
        run: npm ci

      - name: Prepare database
        run: |
          npx prisma generate
          npx prisma migrate deploy
          npm run db:seed

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Real-database tests: constraints, concurrency, payments, webhooks,
      # checkout. They run against the Postgres service above, in their own
      # schema so they cannot touch the seeded catalogue the smoke test uses.
      - name: Integration tests
        run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgresql://svl:ci-only-password@localhost:5432/kalamkari?schema=integration

      - name: Build
        run: npx next build

      # The smoke test drives the real server actions over HTTP against the
      # production build — add to cart, read the cart, place a COD order — then
      # asserts against the database. Two of the bugs found while building this
      # were invisible to tsc, eslint and next build, and only appeared when the
      # code actually ran.
      - name: Start the production server
        run: |
          npm start &
          npx wait-on http://localhost:3000 --timeout 60000

      - name: Smoke-test the purchase path
        run: npm run smoke
